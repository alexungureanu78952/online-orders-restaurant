services:
  # ===================================================
  # SQL Server Database Service
  # ===================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: restaurant-db
    # REZOLVARE EROARE 0x80070005: Rulăm ca root pentru a avea drepturi pe volume
    user: root
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: "YourStrongPassword123!" # Parola default (trebuie să fie complexă)
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_ENCRYPTION: 0
    ports:
      - "1433:1433"
    volumes:
      # Data persistence folosind Named Volumes (gestionate de Docker)
      - restaurant_data:/var/opt/mssql/data
      - restaurant_logs:/var/opt/mssql/log
      - restaurant_backup:/var/opt/mssql/backup

      # Mapare scripturi de inițializare (asigură-te că folderul ./Database există lângă acest fișier)
      - ./Database/02_CreateTables.sql:/scripts/02_CreateTables.sql:ro
      - ./Database/03_CreateStoredProcedures.sql:/scripts/03_CreateStoredProcedures.sql:ro
      - ./Database/04_CreateIndexes.sql:/scripts/04_CreateIndexes.sql:ro
      - ./Database/05_SeedSampleData.sql:/scripts/05_SeedSampleData.sql:ro
      - ./Database/06_EnableMenuOrderItems.sql:/scripts/06_EnableMenuOrderItems.sql:ro
      - ./Database/07_SeedBurgerKingSamples.sql:/scripts/07_SeedBurgerKingSamples.sql:ro
      - ./Database/08_SeedDemoUsers.sql:/scripts/08_SeedDemoUsers.sql:ro
      - ./Database/09_BurgerKingCatalogAndDemoOrders.sql:/scripts/09_BurgerKingCatalogAndDemoOrders.sql:ro
    healthcheck:
      # Am schimbat calea către sqlcmd aici
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "127.0.0.1", "-U", "sa", "-P", "YourStrongPassword123!", "-C", "-Q", "SELECT 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - restaurant-network
    restart: unless-stopped

# ===================================================
# Networks
# ===================================================
networks:
  restaurant-network:
    driver: bridge

# ===================================================
# Volumes
# ===================================================
volumes:
  restaurant_data:
  restaurant_logs:
  restaurant_backup:
