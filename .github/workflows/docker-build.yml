name: Build Docker Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'RestaurantOrderManagement/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-order-management
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker image scan for vulnerabilities
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            ${{ secrets.DOCKER_USERNAME }}/restaurant-order-management:${{ github.sha }}

# ===================================================
# Setup Instructions
# ===================================================
#
# 1. Add GitHub Secrets:
#    - Settings → Secrets and variables → Actions
#    - Add DOCKER_USERNAME (your Docker Hub username)
#    - Add DOCKER_PASSWORD (Docker Hub access token)
#
# 2. Generate Docker Hub Token:
#    - Docker Hub → Account Settings → Security → New Access Token
#    - Permissions: Read & Write
#    - Copy token to GitHub secret
#
# 3. Trigger Workflow:
#    - Automatically on push to main/develop
#    - Manually via Actions tab
#
# 4. View Results:
#    - Actions tab → Latest run
#    - Check Docker Hub for image
#    - Check GitHub Packages registry
#
# ===================================================
# Image Tags
# ===================================================
#
# Generated tags depend on trigger:
#
# On push to main:
#   - latest
#   - sha-<commit-hash>
#   - branch-main
#
# On push to develop:
#   - develop
#   - sha-<commit-hash>
#   - branch-develop
#
# On tag push (v1.2.3):
#   - v1.2.3
#   - 1.2
#   - 1
#   - latest (if on main)
#
# ===================================================
